services:
  postgres:
    build:
      context: ./postgres
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
      POSTGRES_DB: campus_qa
    ports:
      - "5432:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_qa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - campus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  embed-server:
    build:
      context: ./embed-server
    container_name: campus-embed-server
    restart: unless-stopped
    environment:
      EMBED_MODEL: BAAI/bge-large-zh-v1.5
      EMBED_DEVICE: cpu
      EMBED_BATCH_SIZE: "32"
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
    ports:
      - "18080:8000"
    volumes:
      - campus_embed_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: campus-server
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://campus:campus123@postgres:5432/campus_qa?sslmode=disable
      EMBED_BASE_URL: http://embed-server:8000
      REDIS_ADDR: redis:6379
    ports:
      - "23456:23456"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed-server:
        condition: service_healthy

  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        VITE_API_BASE_URL: http://100.115.97.57:23456
    container_name: campus-console
    restart: unless-stopped
    ports:
      - "23457:80"

volumes:
  campus_postgres_data:
  campus_redis_data:
  campus_embed_models:
